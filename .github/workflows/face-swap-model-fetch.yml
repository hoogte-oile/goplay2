name: face-swap-cpu-real
on:
  push:
    branches:
      - tmp-face-swap-eval2-20260916
permissions:
  contents: read
jobs:
  inswapper-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Decode and verify inputs
        run: |
          set -euxo pipefail
          mkdir -p inputs outputs weights
          base64 -di .faceswap_eval_20260916/b64/src_male.jpg.b64 > inputs/src_male.jpg
          base64 -di .faceswap_eval_20260916/b64/target_male.jpg.b64 > inputs/target_male.jpg
          base64 -di .faceswap_eval_20260916/b64/src_female.jpg.b64 > inputs/src_female.jpg
          base64 -di .faceswap_eval_20260916/b64/target_female.jpg.b64 > inputs/target_female.jpg
          python - <<'PY'
          from PIL import Image
          import os
          for p in ['inputs/src_male.jpg','inputs/target_male.jpg','inputs/src_female.jpg','inputs/target_female.jpg']:
              im=Image.open(p); im.verify(); print(p, os.path.getsize(p), im.format)
          PY
      - name: Install InSwapper CPU stack
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          python -m pip install 'numpy<2' 'opencv-python-headless<4.12' onnxruntime insightface==0.7.3 Pillow
          curl -fL --retry 5 --retry-delay 3 'https://huggingface.co/JackCui/facefusion/resolve/main/inswapper_128.onnx?download=true' -o weights/inswapper_128.onnx
          sha256sum weights/inswapper_128.onnx
      - name: Run InSwapper male and female on CPU
        run: |
          python - <<'PY'
          import cv2,json,time
          from insightface.app import FaceAnalysis
          from insightface.model_zoo import get_model
          app=FaceAnalysis(name='buffalo_l',providers=['CPUExecutionProvider'])
          t0=time.perf_counter(); app.prepare(ctx_id=-1,det_size=(640,640)); t1=time.perf_counter()
          swapper=get_model('weights/inswapper_128.onnx',providers=['CPUExecutionProvider']); t2=time.perf_counter()
          def largest(fs): return max(fs,key=lambda f:(f.bbox[2]-f.bbox[0])*(f.bbox[3]-f.bbox[1]))
          report={'faceanalysis_init_s':t1-t0,'swapper_load_s':t2-t1,'pairs':{}}
          for name in ['male','female']:
              src=cv2.imread(f'inputs/src_{name}.jpg'); tgt=cv2.imread(f'inputs/target_{name}.jpg')
              a=time.perf_counter(); sf=app.get(src); b=time.perf_counter(); tf=app.get(tgt); c=time.perf_counter()
              if not sf or not tf: raise RuntimeError(f'detection failed {name}: src={len(sf)} tgt={len(tf)}')
              s,t=largest(sf),largest(tf)
              out=swapper.get(tgt,t,s,paste_back=True); d=time.perf_counter()
              cv2.imwrite(f'outputs/inswapper_{name}.jpg',out,[cv2.IMWRITE_JPEG_QUALITY,98])
              report['pairs'][name]={'src_detect_s':b-a,'target_detect_s':c-b,'swap_s':d-c,'total_s':d-a,
                  'src_bbox':[float(x) for x in s.bbox],'target_bbox':[float(x) for x in t.bbox]}
          open('outputs/inswapper_timing.json','w').write(json.dumps(report,indent=2))
          print(json.dumps(report,indent=2))
          PY
          ls -lh outputs
      - uses: actions/upload-artifact@v4
        with:
          name: inswapper-real-cpu
          path: outputs/
          retention-days: 2
          compression-level: 0
